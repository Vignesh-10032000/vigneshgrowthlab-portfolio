site:
  name: Vignesh Growth Lab
  # Single source for every canonical, Open Graph, Twitter and JSON-LD absolute
  # URL ("siteUrl"). Interim Netlify domain — swap for the custom domain if one
  # is registered later.
 site: 'https://vigneshgrowthlab.dev'
  base: '/'
  trailingSlash: false

# Default SEO metadata — every route overrides title/description with its own
# values from the content matrices; these are safety-net defaults only.
metadata:
  title:
    default: Vignesh Growth Lab — Websites, POS & WhatsApp Automation in Tamil Nadu
    template: '%s'
  description: 'Pollachi-based MSME building fast websites, custom software, retail POS and WhatsApp AI automation for Tamil Nadu businesses. 15+ projects delivered.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Vignesh Growth Lab
    images:
      # Brand share card (1200×630): logo lockup + "Build. Automate. Grow." +
      # service chips + domain, on the dark violet theme. Source design in
      # design history; regenerate at the same size if the brand changes.
      - url: '~/assets/images/og-cover.png'
        width: 1200
        height: 626
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    post:
      isEnabled: false
    list:
      isEnabled: false
    category:
      isEnabled: false
    tag:
      isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark:only'
