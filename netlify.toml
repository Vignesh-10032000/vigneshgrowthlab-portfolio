[build]
  publish = "dist"
  command = "npm run build"

# Force 301 permanent redirect from Netlify subdomain to primary custom domain
[[redirects]]
  from = "https://vigneshgrowthlab.netlify.app/*"
  to = "https://vigneshgrowthlab.dev/:splat"
  status = 301
  force = true

# ─── WhatsApp business card short link ───────────────────────────────────────
# To change the destination later, update the `to` value in these two rules.
[[redirects]]
  from   = "/hi"
  to     = "https://wa.me/918220034139?text=Hi%20Vignesh%20Growth%20Lab%2C%20I%20got%20your%20card%20and%20I%27m%20interested%20in%20a%20website%2Fsoftware%20for%20my%20business."
  status = 302

[[redirects]]
  from   = "/hi/"
  to     = "https://wa.me/918220034139?text=Hi%20Vignesh%20Growth%20Lab%2C%20I%20got%20your%20card%20and%20I%27m%20interested%20in%20a%20website%2Fsoftware%20for%20my%20business."
  status = 302
# ─────────────────────────────────────────────────────────────────────────────

# SPA routing redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term cache for immutable Vite hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
